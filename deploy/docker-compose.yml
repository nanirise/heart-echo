services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [heart_echo_net]

  chromadb:
    # 与 ai-service/requirements.txt 的 chromadb 同版本：客户端与服务端 API 版本必须匹配。
    image: chromadb/chroma:0.6.3
    restart: always
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
      - chroma_cache:/root/.cache/chroma    # 缓存模型，避免容器重建重新下载
    ports:
      # 只绑回环：宿主机调试用（8001 避开 ai-service 的 8000）。
      # 生产对外仍只有 Nginx 80，Chroma 不对公网开放（AGENTS §4.10）。
      - "127.0.0.1:${CHROMA_HOST_PORT:-8001}:8000"
    networks: [heart_echo_net]

  # ===== 明确不做：Redis =====
  # 本项目 QPS 极低，没有缓存需求。加它只会多一个要运维的容器。

  ai-service:
    build: ../ai-service
    restart: always
    env_file: .env
    environment:
      # 容器内只能走服务名与内部端口；.env 里若写成 localhost:8001 是给宿主机调试用的。
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      - chromadb
    # python:3.11-slim 没有 wget，用 python 自带的 urllib 探活
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [heart_echo_net]

  backend:
    build: ../backend
    restart: always
    env_file: .env
    environment:
      DB_HOST: postgres
      # backend 只读 DB_*；密码唯一来源是 POSTGRES_PASSWORD，避免两处各写一份
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [heart_echo_net]

  # 前端没有独立容器：由 deploy/Dockerfile 的 node 阶段构建后 COPY 进 nginx 镜像
  nginx:
    build:
      context: ..                 # 构建上下文是仓库根目录（需访问 frontend/ 与 deploy/）
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [heart_echo_net]

volumes:
  pg_data:
  chroma_data:
  chroma_cache:

networks:
  heart_echo_net:
    driver: bridge