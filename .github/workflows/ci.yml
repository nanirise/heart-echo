name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heart_echo
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: heart_echo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heart_echo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci_only_test_secret_at_least_32_chars_ok
      AI_SERVICE_TOKEN: ci_only_test_token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test
        working-directory: backend
        run: go test ./...

  # ai-service 是顶层服务目录，按 AGENTS §9 与 frontend / backend 同级各占一个 job。
  # 不需要 services / env：测试用 monkeypatch 注入 AI_SERVICE_TOKEN 与 DEEPSEEK_API_KEY，
  # 并把 DeepSeek 调用整个挡在门外——跑测试不碰网络、不烧 API 余额。
  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - name: Install
        working-directory: ai-service
        # requirements-dev.txt 首行是 -r requirements.txt，装这一份就够了。
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: ai-service
        run: pytest